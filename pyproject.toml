[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gym-tracker"
version = "0.3.0"
description = "Acompanhamento de treinos importados do WhatsApp"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "openai>=1.68,<3",
    "pandas>=2.2,<4",
    "plotly>=5.22,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<3",
    "streamlit>=1.36,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
gym-tracker = "gym_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gym_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
