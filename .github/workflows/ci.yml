name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gym_tracker_test
          POSTGRES_USER: gym_tracker
          POSTGRES_PASSWORD: gym_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_tracker -d gym_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gym_tracker:gym_tracker@localhost:5432/gym_tracker_test
      GYM_TRACKER_TEST_DATABASE_URL: postgresql+psycopg://gym_tracker:gym_tracker@localhost:5432/gym_tracker_test
      DATA_BACKEND: csv
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
